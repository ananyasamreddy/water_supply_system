<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartWater GIS - Municipal Water Supply Authority Portal</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="color:#ef4444;background:#1e293b;padding:24px;border:1px solid #ef4444;margin:20px;border-radius:12px;font-family:monospace;font-size:14px;">' +
            '<h2 style="margin:0 0 10px 0;color:#f87171;">Client-Side JavaScript Error</h2>' +
            '<b>Message:</b> ' + msg + '<br>' +
            '<b>Location:</b> ' + url + ':' + line + ':' + col + '<br><br>' +
            '<pre style="white-space:pre-wrap;color:#cbd5e1;">' + (error && error.stack ? error.stack : '') + '</pre>' +
            '</div>';
        }
      };
      window.onunhandledrejection = function(e) {
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="color:#ef4444;background:#1e293b;padding:24px;border:1px solid #ef4444;margin:20px;border-radius:12px;font-family:monospace;font-size:14px;">' +
            '<h2 style="margin:0 0 10px 0;color:#f87171;">Unhandled Promise Rejection</h2>' +
            '<b>Reason:</b> ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) +
            '</div>';
        }
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
